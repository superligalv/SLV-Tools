name: Actualizar Feed RSS

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar feed RSS de WordPress
        run: |
          curl -s "https://api.rss2json.com/v1/api.json?rss_url=https://tiempodesuperliga.rf.gd/feed/" -o noticias.json

      - name: Subir cambios al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-actualización de noticias RSS"
          file_pattern: noticias.json
          push_options: '--force'
