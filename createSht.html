<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSM Plus v3</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/positions.css">
  <link rel="stylesheet" href="./css/createSht.css?v=9">
</head>
<body>

  <h1 id="titleText">TSM Plus v3</h1>

  <div class="tsm-layout">
    <details open class="panel-main">
      <summary>Alineacion</summary>
      <div class="tsm-body">

      <div class="tabs">
        <div class="tab active" data-tab="players">Players/Team Info</div>
        <div class="tab" data-tab="conditions">Conditions</div>
      </div>

      <div class="tab-panel">

        <!-- PLAYERS / TEAM INFO -->
        <div class="tab-content active" id="tab-players">
          <div class="top-grid">
            <fieldset class="starting-eleven-box">
              <legend>Starting Eleven</legend>
              <div id="startingEleven"></div>
            </fieldset>

            <div class="right-stack">
              <fieldset>
                <legend>Team Info</legend>
                <div class="ti-row abbr">
                  <label>Abbreviation</label>
                  <select id="abbrInput"><option value=""></option></select>
                </div>
                <div class="ti-row">
                  <label>Starting Tactic</label>
                  <select id="tacticInput"><option></option><option>P</option><option>A</option><option>C</option><option>N</option><option>L</option><option>E</option><option>D</option></select>
                </div>
                <div class="ti-row">
                  <label>Penalty Taker</label>
                  <select id="pkSelect"><option value=""></option></select>
                </div>
                <div class="ti-row agg">
                  <label>Aggression</label>
                  <select id="aggSelect"><option value=""></option></select>
                </div>
              <p class="roster-status" id="rosterStatus"></p>
              </fieldset>

              <fieldset>
                <legend>Substitutes</legend>
                <div id="substitutes"></div>
              </fieldset>
            </div>
          </div>

          <div class="action-buttons">
            <button class="btn primary wide" id="btnAction">Validar</button>
            <button class="btn wide" id="btnLoadRoster">Load Roster</button>
            <button class="btn wide" id="btnLoadTeamsheet">Load Teamsheet</button>
          </div>
          <div class="validation" id="validation" aria-live="polite"></div>
        </div>

        <!-- CONDITIONS -->
        <div class="tab-content" id="tab-conditions">

          <fieldset class="cond-fieldset">
            <legend>Tactic Change</legend>
            <div class="cond-row">
              <div class="cond-field">
                <label>New Tactic</label>
                <select class="wide-cond" id="tc-tactic"><option></option><option>P</option><option>A</option><option>C</option><option>N</option><option>L</option><option>E</option><option>D</option></select>
              </div>
              <div class="cond-field"><label>If Min</label>
                <div class="pair"><select id="tc-min-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="tc-min-val"></div></div>
              <div class="cond-field"><label>If Score</label>
                <div class="pair"><select id="tc-score-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="tc-score-val"></div></div>
              <div class="cond-field"><label>If Shots</label>
                <div class="pair"><select id="tc-shots-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="tc-shots-val"></div></div>
            </div>
            <div class="cond-row">
              <div class="cond-field"><label>If Yellow</label><select id="tc-yellow"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Red</label><select id="tc-red"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Injured</label><select id="tc-injured"><option></option><option>Yes</option></select></div>
              <div class="cond-add-row" style="flex:1"><button class="btn small" id="tc-add">Add</button></div>
            </div>
          </fieldset>

          <fieldset class="cond-fieldset">
            <legend>Substitution</legend>
            <div class="cond-row">
              <div class="cond-field"><label>Off</label><select class="wide-cond" id="sub-off"></select></div>
              <div class="cond-field"><label>On</label><select class="wide-cond" id="sub-on"></select></div>
              <div class="cond-field"><label>Position</label><select id="sub-pos"></select></div>
              <div class="cond-field"><label>If Min</label>
                <div class="pair"><select id="sub-min-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="sub-min-val"></div></div>
              <div class="cond-field"><label>If Score</label>
                <div class="pair"><select id="sub-score-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="sub-score-val"></div></div>
              <div class="cond-field"><label>If Shots</label>
                <div class="pair"><select id="sub-shots-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="sub-shots-val"></div></div>
            </div>
            <div class="cond-row">
              <div class="cond-field"><label>If Yellow</label><select id="sub-yellow"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Red</label><select id="sub-red"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Injured</label><select id="sub-injured"><option></option><option>Yes</option></select></div>
              <div class="cond-add-row" style="flex:1"><button class="btn small" id="sub-add">Add</button></div>
            </div>
          </fieldset>

          <fieldset class="cond-fieldset">
            <legend>Reposition Player</legend>
            <div class="cond-row">
              <div class="cond-field"><label>Player</label><select class="wide-cond" id="rp-player"></select></div>
              <div class="cond-field"><label>Position</label><select id="rp-pos"></select></div>
              <div class="cond-field"><label>If Min</label>
                <div class="pair"><select id="rp-min-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="rp-min-val"></div></div>
              <div class="cond-field"><label>If Score</label>
                <div class="pair"><select id="rp-score-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="rp-score-val"></div></div>
              <div class="cond-field"><label>If Shots</label>
                <div class="pair"><select id="rp-shots-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="rp-shots-val"></div></div>
            </div>
            <div class="cond-row">
              <div class="cond-field"><label>If Yellow</label><select id="rp-yellow"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Red</label><select id="rp-red"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Injured</label><select id="rp-injured"><option></option><option>Yes</option></select></div>
              <div class="cond-add-row" style="flex:1"><button class="btn small" id="rp-add">Add</button></div>
            </div>
          </fieldset>

          <fieldset class="cond-fieldset">
            <legend>Change Aggression</legend>
            <div class="cond-row">
              <div class="cond-field"><label>New Aggression</label>
                <select id="ca-agg"><option></option></select>
              </div>
              <div class="cond-field"><label>If Min</label>
                <div class="pair"><select id="ca-min-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="ca-min-val"></div></div>
              <div class="cond-field"><label>If Score</label>
                <div class="pair"><select id="ca-score-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="ca-score-val"></div></div>
              <div class="cond-field"><label>If Shots</label>
                <div class="pair"><select id="ca-shots-op"><option></option><option>=</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option></select>
                <input type="number" id="ca-shots-val"></div></div>
            </div>
            <div class="cond-row">
              <div class="cond-field"><label>If Yellow</label><select id="ca-yellow"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Red</label><select id="ca-red"><option></option><option>Yes</option></select></div>
              <div class="cond-field"><label>If Injured</label><select id="ca-injured"><option></option><option>Yes</option></select></div>
              <div class="cond-add-row" style="flex:1"><button class="btn small" id="ca-add">Add</button></div>
            </div>
          </fieldset>

        </div>
      </div>
      </div>
    </details>

    <details open class="panel-sheet">
      <summary>Teamsheet</summary>
      <div class="tsm-body">
        <textarea id="teamsheetOutput" readonly spellcheck="false"></textarea>
        <div class="right-buttons">
          <button class="btn" id="btnExport">Guardar .txt</button>
          <button class="btn" id="btnDeleteConditional">Delete conditional</button>
          <button class="btn" id="btnClearAll">Clear All Fields</button>
        </div>
      </div>
    </details>
  </div>

  <!-- Cargar plantilla / teamsheet (pegar texto o abrir archivo) -->
  <div class="modal" id="modalOverlay">
    <div class="modal-content wide">
      <h3 id="modalTitle">Modal</h3>
      <p id="modalHint"></p>
      <textarea id="modalTextarea"></textarea>
      <div class="modal-footer">
        <label class="btn file-btn">Abrir archivo...<input type="file" id="modalFile" accept=".txt,.csv,text/plain" hidden></label>
        <button class="btn" id="modalCancel">Cancelar</button>
        <button class="btn primary" id="modalOk">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Confirmación de envío con PIN -->
  <div class="modal" id="pinModal">
    <div class="modal-content">
      <h3>Introduce tu PIN</h3>
      <p id="pinHint"></p>
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="one-time-code" placeholder="PIN">
      <p id="pinError"></p>
      <div class="modal-footer">
        <button class="btn" id="pinCancel">Cancelar</button>
        <button class="btn primary" id="pinOk">Confirmar envio</button>
      </div>
    </div>
  </div>

  <script src="./JS/createSht.js?v=9"></script>
</body>
</html>
