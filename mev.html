<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Cliente oficial de Supabase -->
    <link rel="stylesheet" href="./css/mev.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loading" class="loading">Cargando datos...</div>

<table id="matriz-tabla" style="display: none;">
    <thead>
        <tr>
            <th>MEDIA</th>
            <th>20(-)</th>
            <th>21-23</th>
            <th>24-26</th>
            <th>27-29</th>
            <th>30-32</th>
            <th>33(+)</th>
        </tr>
    </thead>
    <tbody id="tabla-body">
        <!-- Se inyecta automáticamente desde Supabase -->
    </tbody>
</table>

<script>
    // Reemplaza con los datos de tu proyecto Supabase
    //const SUPABASE_URL = 'TU_SUPABASE_URL';
    //const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
// Configura tus credenciales de Supabase aquí
    const SUPABASE_URL = "https://bxgkacenzipwwbawftdl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4Z2thY2Vuemlwd3diYXdmdGRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTEyNDQsImV4cCI6MjEwNjI4NzI0NH0.V4jfI7wDvKN-yePelVeAeA-3pEByfwS99o3s7k-vSWs";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cargarMatriz() {
        try {
            const { data, error } = await supabaseClient
                .from('tabla_medias_edades')
                .select('*')
                .order('media', { ascending: true });

            if (error) throw error;

            if (data && data.length > 0) {
                const agrupado = {};
                const rangos = ['20(-)', '21-23', '24-26', '27-29', '30-32', '33(+)'];

                data.forEach(row => {
                    if (!agrupado[row.media]) agrupado[row.media] = {};
                    agrupado[row.media][row.rango_edad] = row.valor_texto;
                });

                const tbody = document.getElementById('tabla-body');
                tbody.innerHTML = '';

                Object.keys(agrupado).forEach(media => {
                    let tr = document.createElement('tr');
                    let html = `<td style="font-weight: bold; background: rgba(255, 255, 255, 0.05);">${media}</td>`;
                    
                    rangos.forEach(rango => {
                        let val = agrupado[media][rango] || '-';
                        html += `<td>${val}</td>`;
                    });
                    
                    tr.innerHTML = html;
                    tbody.appendChild(tr);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('matriz-tabla').style.display = 'table';
            }
        } catch (err) {
            console.error('Error cargando la tabla:', err);
            document.getElementById('loading').innerText = 'Error al cargar datos.';
        }
    }

    cargarMatriz();
</script>

</body>
</html>
