<style>
  .widget-svl-100alto {
    background: #ffffff;
    border: 1px solid #e3e3e3;
    border-radius: 8px;
    padding: 8px 12px;
    margin: 5px auto;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    width: 100% !important;
    max-height: 100px !important;
    height: 100px !important;
    overflow: hidden !important;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .titulo-widget-100alto {
    color: #333333;
    font-size: 11px;
    margin: 0 0 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: bold;
    border-bottom: 2px solid #e63946;
    padding-bottom: 2px;
    display: inline-block;
  }

  .news-carousel-wrapper-100alto {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 55px;
  }

  .grid-eventos-100alto {
    display: flex;
    flex-direction: row;
    flex: 1;
    overflow: hidden;
    height: 100%;
  }

  .news-slide-100alto {
    display: none;
    width: 100%;
    height: 100%;
    animation: fadeIn 0.3s ease-in-out;
  }

  .news-slide-100alto.active {
    display: block;
  }

  .evento-item-100alto {
    background: #fdfdfd;
    border: 1px solid #eaeaea;
    border-radius: 6px;
    padding: 4px 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
  }

  /* Textos a la izquierda */
  .evento-info-100alto {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 8px;
    flex: 1;
    overflow: hidden;
  }

  .evento-dia-semana-100alto {
    font-size: 9px;
    color: #888;
    font-weight: bold;
    text-transform: uppercase;
    line-height: 1;
  }

  .evento-nombre-100alto {
    font-size: 12px;
    font-weight: bold;
    color: #222222;
    margin: 2px 0;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .evento-nombre-100alto a {
    color: #222222;
    text-decoration: none;
  }

  .evento-nombre-100alto a:hover {
    color: #e63946;
    text-decoration: underline;
  }

  .evento-competicion-100alto {
    font-size: 9px;
    color: #e63946;
    font-weight: bold;
    line-height: 1;
  }

  /* Fecha a la derecha */
  .evento-fecha-100alto {
    background: #f7f7f7;
    border-radius: 4px;
    min-width: 48px;
    height: 42px;
    padding: 2px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid #eee;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  .fecha-gran-num-100alto {
    font-size: 16px;
    font-weight: 900;
    color: #333;
    line-height: 1;
  }

  .fecha-gran-mes-100alto {
    font-size: 8px;
    font-weight: bold;
    color: #666;
    text-transform: uppercase;
    margin-top: 1px;
    letter-spacing: 0.5px;
  }

  /* Botones laterales */
  .carousel-btn-100alto {
    background: #f7f7f7;
    border: 1px solid #eee;
    border-radius: 4px;
    color: #555;
    font-size: 12px;
    cursor: pointer;
    padding: 10px 6px;
    flex-shrink: 0;
  }

  .carousel-btn-100alto:hover {
    background: #e63946;
    color: #ffffff;
    border-color: #e63946;
  }

  .loading-svl-100alto {
    color: #999;
    font-size: 11px;
    text-align: center;
    width: 100%;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>

<div class="widget-svl-100alto">
  <div><div class="titulo-widget-100alto">TDS Últimas Noticias</div></div>
  
  <div class="news-carousel-wrapper-100alto">
    <button class="carousel-btn-100alto" onclick="prevSlideNews100H()">&#10094;</button>

    <div id="contenedor-svl-100alto-news" class="grid-eventos-100alto">
      <div class="evento-item-100alto">
        <div class="loading-svl-100alto">Cargando últimas noticias...</div>
      </div>
    </div>

    <button class="carousel-btn-100alto" onclick="nextSlideNews100H()">&#10095;</button>
  </div>
</div>

<script>
  (function() {
    let slidesNews100H = [];
    let currentIndexNews100H = 0;
    let autoPlayIntervalNews100H;

    async function loadCarouselNews100H() {
      const contenedor = document.getElementById('contenedor-svl-100alto-news');
      if (!contenedor) return;

      try {
        const response = await fetch('https://superligalv.github.io/SLV-Tools/noticias.json');
        if (!response.ok) throw new Error('No se pudo cargar noticias.json');

        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) {
          contenedor.innerHTML = `<div class="loading-svl-100alto">No hay noticias.</div>`;
          return;
        }

        slidesNews100H = posts.map(post => {
          const fechaObj = post.date ? new Date(post.date) : new Date();
          const diaNum = fechaObj.getDate();
          const mesNombre = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '');
          const diaSemana = fechaObj.toLocaleDateString('es-ES', { weekday: 'long' });

          return {
            title: post.title ? post.title.rendered : 'Sin título',
            link: post.link || '#',
            diaNum: diaNum,
            mesNombre: mesNombre,
            diaSemana: diaSemana
          };
        });

        renderCarouselNews100H();
        startAutoPlayNews100H();
      } catch (err) {
        console.error("Error carrusel:", err);
        contenedor.innerHTML = `<div class="loading-svl-100alto" style="color:red;">Error al cargar.</div>`;
      }
    }

    function renderCarouselNews100H() {
      const container = document.getElementById('contenedor-svl-100alto-news');
      if (!container) return;

      container.innerHTML = slidesNews100H.map((slide, index) => `
        <div class="news-slide-100alto ${index === 0 ? 'active' : ''}">
          <div class="evento-item-100alto">
            <div class="evento-info-100alto">
              <span class="evento-dia-semana-100alto">${slide.diaSemana}</span>
              <div class="evento-nombre-100alto">
                <a href="${slide.link}" target="_blank" title="${slide.title}">${slide.title}</a>
              </div>
              <div class="evento-competicion-100alto">TIEMPO DE SUPERLIGA</div>
            </div>
            <div class="evento-fecha-100alto">
              <span class="fecha-gran-num-100alto">${slide.diaNum}</span>
              <span class="fecha-gran-mes-100alto">${slide.mesNombre}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showSlideNews100H(index) {
      const slideElements = document.querySelectorAll('#contenedor-svl-100alto-news .news-slide-100alto');
      if (slideElements.length === 0) return;

      slideElements[currentIndexNews100H].classList.remove('active');
      currentIndexNews100H = (index + slideElements.length) % slideElements.length;
      slideElements[currentIndexNews100H].classList.add('active');
    }

    window.nextSlideNews100H = function() {
      showSlideNews100H(currentIndexNews100H + 1);
      resetAutoPlayNews100H();
    };

    window.prevSlideNews100H = function() {
      showSlideNews100H(currentIndexNews100H - 1);
      resetAutoPlayNews100H();
    };

    function startAutoPlayNews100H() {
      autoPlayIntervalNews100H = setInterval(() => {
        showSlideNews100H(currentIndexNews100H + 1);
      }, 5000);
    }

    function resetAutoPlayNews100H() {
      clearInterval(autoPlayIntervalNews100H);
      startAutoPlayNews100H();
    }

    setTimeout(loadCarouselNews100H, 200);
  })();
</script>
