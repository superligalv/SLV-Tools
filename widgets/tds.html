<style>
  .widget-svl-horizontal {
    background: #ffffff;
    border: 1px solid #e3e3e3;
    border-radius: 8px;
    padding: 15px;
    margin: 10px auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    font-family: Arial, sans-serif;
    box-sizing: border-box;
    width: 100%;
  }

  .titulo-widget-horiz {
    color: #333333;
    font-size: 14px;
    margin: 0 0 12px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
    border-bottom: 2px solid #e63946;
    padding-bottom: 4px;
    display: inline-block;
  }

  .news-carousel-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .grid-eventos {
    display: flex;
    flex-direction: row;
    flex: 1;
    overflow: hidden;
    width: 100%;
  }

  .news-slide {
    display: none;
    width: 100%;
    animation: fadeIn 0.4s ease-in-out;
  }

  .news-slide.active {
    display: block;
    width: 100%;
  }

  .evento-item-horiz {
    background: #fdfdfd;
    border: 1px solid #eaeaea;
    border-radius: 6px;
    padding: 10px 12px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  /* Bloque Izquierdo: Textos */
  .evento-info-izq {
    display: flex;
    flex-direction: column;
    padding-right: 10px;
    flex: 1;
    text-align: left;
  }

  .evento-dia-semana {
    font-size: 11px;
    color: #888;
    font-weight: bold;
    text-transform: uppercase;
  }

  .evento-nombre-horiz {
    font-size: 14px;
    font-weight: bold;
    color: #222222;
    margin: 4px 0;
    line-height: 1.3;
  }

  .evento-nombre-horiz a {
    color: #222222;
    text-decoration: none;
    transition: color 0.2s;
  }

  .evento-nombre-horiz a:hover {
    color: #e63946;
    text-decoration: underline;
  }

  .evento-competicion-horiz {
    font-size: 11px;
    color: #e63946;
    font-weight: bold;
  }

  /* Bloque Derecho: Fecha gigante */
  .evento-fecha-der {
    background: #f7f7f7;
    border-radius: 6px;
    min-width: 60px;
    padding: 6px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid #eee;
    flex-shrink: 0;
  }

  .fecha-gran-num {
    font-size: 22px;
    font-weight: 900;
    color: #333;
    line-height: 1;
  }

  .fecha-gran-mes {
    font-size: 10px;
    font-weight: bold;
    color: #666;
    text-transform: uppercase;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  /* Botones de navegación laterales */
  .carousel-btn {
    background: #f7f7f7;
    border: 1px solid #eee;
    border-radius: 6px;
    color: #555;
    font-size: 16px;
    cursor: pointer;
    padding: 8px 12px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .carousel-btn:hover {
    background: #e63946;
    color: #ffffff;
    border-color: #e63946;
  }

  .loading-svl {
    color: #999;
    font-size: 14px;
    padding: 10px 0;
    text-align: center;
    width: 100%;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="widget-svl-horizontal">
  <div class="titulo-widget-horiz">TDS Últimas Noticias</div>
  
  <div class="news-carousel-wrapper">
    <button class="carousel-btn" onclick="prevSlideNews()">&#10094;</button>

    <div id="contenedor-svl-horiz-news" class="grid-eventos">
      <div class="evento-item-horiz">
        <div class="loading-svl">Cargando últimas noticias...</div>
      </div>
    </div>

    <button class="carousel-btn" onclick="nextSlideNews()">&#10095;</button>
  </div>
</div>

<script>
  (function() {
    let slidesNews = [];
    let currentIndexNews = 0;
    let autoPlayIntervalNews;

    async function loadCarouselNews() {
      const contenedor = document.getElementById('contenedor-svl-horiz-news');
      if (!contenedor) return;

      try {
        const response = await fetch('https://superligalv.github.io/SLV-Tools/noticias.json');
        if (!response.ok) throw new Error('No se pudo cargar el archivo noticias.json');

        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) {
          contenedor.innerHTML = `<div class="loading-svl">No hay noticias disponibles.</div>`;
          return;
        }

        slidesNews = posts.map(post => {
          const fechaObj = post.date ? new Date(post.date) : new Date();
          const diaNum = fechaObj.getDate();
          const mesNombre = fechaObj.toLocaleDateString('es-ES', { month: 'short' }).replace('.', '');
          const diaSemana = fechaObj.toLocaleDateString('es-ES', { weekday: 'long' });

          return {
            title: post.title ? post.title.rendered : 'Sin título',
            link: post.link || '#',
            diaNum: diaNum,
            mesNombre: mesNombre,
            diaSemana: diaSemana
          };
        });

        renderCarouselNews();
        startAutoPlayNews();
      } catch (err) {
        console.error("Error cargando carrusel:", err);
        contenedor.innerHTML = `<div class="loading-svl" style="color:red;">Error al cargar las noticias.</div>`;
      }
    }

    function renderCarouselNews() {
      const container = document.getElementById('contenedor-svl-horiz-news');
      if (!container) return;
      container.innerHTML = slidesNews.map((slide, index) => `
        <div class="news-slide ${index === 0 ? 'active' : ''}">
          <div class="evento-item-horiz">
            <div class="evento-info-izq">
              <span class="evento-dia-semana">${slide.diaSemana}</span>
              <div class="evento-nombre-horiz">
                <a href="${slide.link}" target="_blank">${slide.title}</a>
              </div>
              <div class="evento-competicion-horiz">TIEMPO DE SUPERLIGA</div>
            </div>
            <div class="evento-fecha-der">
              <span class="fecha-gran-num">${slide.diaNum}</span>
              <span class="fecha-gran-mes">${slide.mesNombre}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showSlideNews(index) {
      const slideElements = document.querySelectorAll('#contenedor-svl-horiz-news .news-slide');
      if (slideElements.length === 0) return;

      slideElements[currentIndexNews].classList.remove('active');
      currentIndexNews = (index + slideElements.length) % slideElements.length;
      slideElements[currentIndexNews].classList.add('active');
    }

    window.nextSlideNews = function() {
      showSlideNews(currentIndexNews + 1);
      resetAutoPlayNews();
    };

    window.prevSlideNews = function() {
      showSlideNews(currentIndexNews - 1);
      resetAutoPlayNews();
    };

    function startAutoPlayNews() {
      autoPlayIntervalNews = setInterval(() => {
        showSlideNews(currentIndexNews + 1);
      }, 5000);
    }

    function resetAutoPlayNews() {
      clearInterval(autoPlayIntervalNews);
      startAutoPlayNews();
    }

    setTimeout(loadCarouselNews, 200);
  })();
</script>
