<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Noticias - Tiempo de Superliga</title>
    <style>
        /* CSS Reset & Minimal Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #222222;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.4;
        }

        /* Dark mode support according to parent or system */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1c1e21;
                color: #e3e6ea;
            }
            .widget-container {
                border-color: #333333 !important;
                background-color: #242526 !important;
            }
            .news-title {
                color: #ffffff !important;
            }
            .news-excerpt {
                color: #b0b3b8 !important;
            }
            .nav-btn {
                background: #3a3b3c !important;
                color: #e3e6ea !important;
                border-color: #4e4f50 !important;
            }
            .nav-btn:hover {
                background: #4e4f50 !important;
            }
            .dot {
                background-color: #555555 !important;
            }
            .dot.active {
                background-color: #10b981 !important;
            }
        }

        /* Widget Shell */
        .widget-container {
            width: 100%;
            height: 100vh;
            max-height: 180px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background-color: #ffffff;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Header Bar */
        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .brand-title {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #059669;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-title:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 4px;
            background-color: #10b981;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Slide Track */
        .carousel-viewport {
            overflow: hidden;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide {
            min-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #65676b;
        }

        .news-title {
            font-size: 14px;
            font-weight: 700;
            color: #111827;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .news-title:hover {
            color: #10b981;
        }

        .news-excerpt {
            font-size: 12px;
            color: #4b5563;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        /* Footer / Navigation Controls */
        .widget-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            padding-top: 4px;
        }

        .dots-container {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #d1d5db;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .dot.active {
            background-color: #10b981;
            width: 14px;
            border-radius: 3px;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .nav-btn {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            color: #374151;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: background 0.15s ease;
        }

        .nav-btn:hover {
            background: #e5e7eb;
        }

        .pause-btn {
            font-size: 9px;
            padding: 0 4px;
            width: auto;
        }
    </style>
</head>
<body>

    <div class="widget-container" id="widget">
        <!-- Encabezado compacto -->
        <div class="widget-header">
            <a href="https://tiempodesuperliga.rf.gd/" target="_blank" class="brand-title">
                ⚡ Tiempo de Superliga
            </a>
            <span class="badge" id="categoryBadge">Noticia</span>
        </div>

        <!-- Área de las Noticias -->
        <div class="carousel-viewport">
            <div class="carousel-track" id="track">
                <!-- Se inyectan dinámicamente -->
            </div>
        </div>

        <!-- Controles inferiores -->
        <div class="widget-controls">
            <div class="dots-container" id="dots"></div>
            
            <div class="nav-buttons">
                <button class="nav-btn pause-btn" id="pauseBtn" title="Pausar / Reanudar">⏸</button>
                <button class="nav-btn" id="prevBtn" title="Anterior">❮</button>
                <button class="nav-btn" id="nextBtn" title="Siguiente">❯</button>
            </div>
        </div>
    </div>

    <script>
        // Configuración del Feed RSS de WordPress
        const RSS_URL = 'https://tiempodesuperliga.rf.gd/feed/';
        
        // API principal RSS2JSON
        const PRIMARY_API = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;
        // Proxy secundario de respaldo por si acaso hay problemas de CORS o límites de API
        const FALLBACK_API = `https://api.allorigins.win/get?url=${encodeURIComponent(RSS_URL)}`;

        // Noticias de respaldo en caso de que falle la conexión externa o servidor offline
        const FALLBACK_NEWS = [
            {
                title: "No se pudieron cargar las noticias en directo",
                category: "Info",
                date: "Hoy",
                excerpt: "Haz clic aquí para visitar directamente el sitio de Tiempo de Superliga.",
                url: "https://tiempodesuperliga.rf.gd/"
            }
        ];

        let news = [];
        let currentIndex = 0;
        let isPaused = false;
        let interval = null;
        const SPEED = 4500; // 4.5 segundos por noticia

        const track = document.getElementById('track');
        const dotsContainer = document.getElementById('dots');
        const categoryBadge = document.getElementById('categoryBadge');
        const widget = document.getElementById('widget');
        const pauseBtn = document.getElementById('pauseBtn');

        // Función para limpiar etiquetas HTML del extracto/descripción
        function stripHtml(html) {
            const tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        // Formatear la fecha del RSS
        function formatDate(dateString) {
            try {
                const d = new Date(dateString);
                if (isNaN(d.getTime())) return "Reciente";
                return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
            } catch (e) {
                return "Reciente";
            }
        }

        // Obtener datos desde el RSS de WordPress
        async function fetchFeed() {
            try {
                // Intentar con API 1: rss2json
                const res = await fetch(PRIMARY_API);
                if (!res.ok) throw new Error("Error en API principal");
                const data = await res.json();
                
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    return data.items.map(item => {
                        // Extraer categoría si existe
                        const category = (item.categories && item.categories.length > 0) ? item.categories[0] : 'Noticia';
                        // Limpiar resumen
                        let cleanExcerpt = stripHtml(item.description || item.content || '');
                        if (cleanExcerpt.length > 110) cleanExcerpt = cleanExcerpt.substring(0, 110) + '...';

                        return {
                            title: item.title,
                            category: category,
                            date: formatDate(item.pubDate),
                            excerpt: cleanExcerpt,
                            url: item.link
                        };
                    });
                } else {
                    throw new Error("Respuesta no válida de RSS2JSON");
                }
            } catch (err) {
                console.warn("Fallo en API principal, intentando método secundario...", err);
                
                try {
                    // Intentar con API 2: AllOrigins (parsing directo de XML)
                    const res = await fetch(FALLBACK_API);
                    const data = await res.json();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    const items = xmlDoc.querySelectorAll("item");

                    if (items.length > 0) {
                        const parsedNews = [];
                        items.forEach((item, index) => {
                            if (index >= 8) return; // Limitar a las 8 más recientes
                            const title = item.querySelector("title")?.textContent || "Sin título";
                            const link = item.querySelector("link")?.textContent || RSS_URL;
                            const pubDate = item.querySelector("pubDate")?.textContent || "";
                            const description = item.querySelector("description")?.textContent || "";
                            const category = item.querySelector("category")?.textContent || "Noticia";

                            let cleanExcerpt = stripHtml(description);
                            if (cleanExcerpt.length > 110) cleanExcerpt = cleanExcerpt.substring(0, 110) + '...';

                            parsedNews.push({
                                title,
                                category,
                                date: formatDate(pubDate),
                                excerpt: cleanExcerpt,
                                url: link
                            });
                        });
                        return parsedNews;
                    }
                } catch (fallbackErr) {
                    console.error("Error al obtener el feed RSS:", fallbackErr);
                }
            }

            // Si falla todo, devolver noticias de contingencia
            return FALLBACK_NEWS;
        }

        // Inicializar Widget
        async function initWidget() {
            // Estado de carga inicial
            track.innerHTML = `
                <div class="slide">
                    <div class="news-excerpt" style="text-align:center;">⏳ Cargando últimas noticias del feed...</div>
                </div>`;
            
            news = await fetchFeed();

            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            news.forEach((item, index) => {
                // Diapositiva
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.innerHTML = `
                    <div class="news-meta">
                        <span>📅 ${item.date}</span>
                    </div>
                    <a href="${item.url}" target="_blank" class="news-title" title="${item.title}">${item.title}</a>
                    <div class="news-excerpt">${item.excerpt}</div>
                `;
                track.appendChild(slide);

                // Indicador (punto)
                const dot = document.createElement('button');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.addEventListener('click', () => goTo(index));
                dotsContainer.appendChild(dot);
            });

            currentIndex = 0;
            updateSlide();
            startAutoplay();
        }

        function updateSlide() {
            if (news.length === 0) return;
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // Actualizar categoría
            categoryBadge.textContent = news[currentIndex].category;

            // Actualizar dots
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (dots[i]) dots[i].classList.toggle('active', i === currentIndex);
            }
        }

        function next() {
            if (news.length === 0) return;
            currentIndex = (currentIndex + 1) % news.length;
            updateSlide();
        }

        function prev() {
            if (news.length === 0) return;
            currentIndex = (currentIndex - 1 + news.length) % news.length;
            updateSlide();
        }

        function goTo(index) {
            currentIndex = index;
            updateSlide();
            resetAutoplay();
        }

        function startAutoplay() {
            if (!interval && !isPaused && news.length > 1) {
                interval = setInterval(next, SPEED);
            }
        }

        function stopAutoplay() {
            if (interval) {
                clearInterval(interval);
                interval = null;
            }
        }

        function resetAutoplay() {
            stopAutoplay();
            startAutoplay();
        }

        // Escuchadores de eventos
        document.getElementById('nextBtn').addEventListener('click', () => { next(); resetAutoplay(); });
        document.getElementById('prevBtn').addEventListener('click', () => { prev(); resetAutoplay(); });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶' : '⏸';
            if (isPaused) stopAutoplay();
            else startAutoplay();
        });

        // Pausar con el ratón
        widget.addEventListener('mouseenter', stopAutoplay);
        widget.addEventListener('mouseleave', () => { if (!isPaused) startAutoplay(); });

        // Iniciar widget
        initWidget();
    </script>
</body>
</html>
