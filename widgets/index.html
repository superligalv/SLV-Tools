<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.widget-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.calendar {
    width: 100%;
    height: 50px;
    overflow: hidden;
}

.bottom-widgets {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    width: 100%;
}

.widget {
    width: 100%;
    min-width: 0;
    text-align: center;
}

.widget strong {
    display: block;
    margin-bottom: 5px;
}

iframe {
    display: block;
    width: 100%;
    border: 0;
}

.calendar iframe {
    height: 50px;
}

.widget iframe {
    height: 120px;
}

@media (max-width: 500px) {
    .bottom-widgets {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="widget-container">

    <!-- CALENDARIO -->
    <div class="calendar">
        <iframe
            src="https://superligalv.github.io/SLV-Tools/nextCalendarEvent.html"
            scrolling="no">
        </iframe>
    </div>

    <!-- NOTICIAS Y ALINEACIONES -->
    <div class="bottom-widgets">

        <div class="widget">
            <strong>TDS ULTIMAS NOTICIAS</strong>
            <iframe
                src="https://superligalv.github.io/SLV-Tools/widgets/tds.html">
            </iframe>
        </div>

        <div class="widget">
            <strong>ALINEACIONES RECIBIDAS</strong>
            <iframe
                src="https://superligalv.github.io/SLV-Tools/listShtSended.html"
                scrolling="no">
            </iframe>
        </div>

    </div>

</div>

</body>
</html>
