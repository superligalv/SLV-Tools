<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivos del Equipo</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/team.css">
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <div class="max-w-4xl mx-auto p-6 my-8 bg-white shadow-md rounded-lg">
        
        <!-- Cabecera de Selección -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-gray-200">
            <h1 id="team-title" class="text-2xl font-black uppercase tracking-wide">Cargando equipo...</h1>
            
            <div class="mt-4 md:mt-0">
                <label for="team-select" class="block text-xs font-bold text-gray-600 uppercase mb-1">Seleccionar Equipo:</label>
                <select id="team-select" class="border border-gray-300 rounded px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-black">
                    <option value="">Selecciona un equipo...</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Objetivos -->
        <div class="overflow-x-auto border border-black">
            <table class="w-full border-collapse text-left">
                <thead>
                    <tr class="bg-black text-white text-xs uppercase tracking-wider">
                        <th class="p-3 border-r border-gray-700 w-1/4">Tipo</th>
                        <th class="p-3 border-r border-gray-700 w-2/3">Objetivo</th>
                        <th class="p-3 text-center w-32">Estado</th>
                    </tr>
                </thead>
                <tbody id="objectives-body" class="divide-y divide-gray-300 text-sm">
                    <tr>
                        <td colspan="3" class="p-6 text-center text-gray-500">Selecciona un equipo para ver sus objetivos.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Enlazamos nuestro archivo JavaScript externo -->
    <script src="../JS/objetivos.js"></script>
</body>
</html>
