<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Equipo · Superliga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/team.css">
</head>
<body>

<div class="page-container">
    <!-- Selector rápido de equipos superior -->
    <header class="team-header-bar">
        <div class="team-selector-wrap">
            <label for="teamSelect">Cambiar de equipo:</label>
            <select id="teamSelect" class="form-control-sm">
                <option value="">-- Selecciona un equipo --</option>
            </select>
        </div>
    </header>

    <!-- Ficha de Encabezado estilo BeSoccer -->
    <section class="team-hero-card" id="teamHero">
        <div class="team-hero-info">
            <div class="team-badge-placeholder" id="teamBadge">
                <span id="badgeText">SLV</span>
            </div>
            <div class="team-details">
                <div class="team-meta-tag" id="teamDivision">DIVISIÓN 1</div>
                <h1 id="teamTitle">Cargando Equipo...</h1>
                <p class="team-subtext" id="teamSubtext">Temporada 1 · Plantilla Oficial</p>
            </div>
        </div>

        <div class="team-stats-summary">
            <div class="stat-box">
                <span class="stat-value" id="statPlayerCount">0</span>
                <span class="stat-label">Jugadores</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="statAvgAge">0.0</span>
                <span class="stat-label">Edad Media</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="statTotalGls">0</span>
                <span class="stat-label">Goles Totales</span>
            </div>
        </div>
    </section>

    <!-- Tabla / Plantilla -->
    <main class="main-card">
        <div class="table-header-flex" style="display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <h2 style="margin: 0;">Plantilla Actual</h2>
                <div class="view-toggle-buttons" style="display: flex; gap: 5px; background: #e2e8f0; padding: 4px; border-radius: 6px;">
                    <button id="btnViewTable" class="btn-toggle active" onclick="cambiarVista('table')" style="padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; background: #ffffff; color: #0f172a;">Vista Normal</button>
                    <button id="btnViewPlain" class="btn-toggle" onclick="cambiarVista('plain')" style="padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; background: transparent; color: #64748b;">Texto Plano ESMS</button>
                </div>
            </div>
            
            <div id="searchWrap">
                <input type="text" id="searchPlayer" class="form-control-sm" placeholder="Buscar jugador por nombre...">
            </div>
            
            <div id="copyWrap" style="display: none;">
                <button onclick="copiarTextoPlano()" style="padding: 6px 14px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Copiar Texto</button>
            </div>
        </div>

        <!-- Vista 1: Tabla BeSoccer -->
        <div id="viewTableContainer" class="table-responsive">
            <table class="besoccer-table">
                <thead>
                    <tr>
                        <th>Jugador</th>
                        <th>Edad</th>
                        <th>Nac.</th>
                        <th>ST</th>
                        <th>TK</th>
                        <th>PS</th>
                        <th>SH</th>
                        <th>AG</th>
                        <th>PJ</th>
                        <th>Goles</th>
                        <th>Asist.</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="rosterTableBody">
                    <tr>
                        <td colspan="12" class="text-center">Selecciona un equipo para cargar la plantilla.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Vista 2: Texto Plano Formateado ESMS -->
        <div id="viewPlainContainer" style="display: none; background: #0f172a; color: #f8fafc; padding: 15px; border-radius: 8px; overflow-x: auto;">
            <pre id="plainTextOutput" style="font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.4; margin: 0; white-space: pre;"></pre>
        </div>
    </main>
</div>

<script src="./js/team.js"></script>
</body>
</html>
