<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superliga Europea - Listado de Equipos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="page-container">
        <!-- Cabecera Limpia con Buscador -->
        <header class="simple-header">
            <div class="header-title-wrap">
                <h1>🛡️ Equipos de la Superliga</h1>
                <p>Selecciona un club para ver su plantilla y estadísticas detalladas</p>
            </div>
            <div class="search-wrap">
                <input type="text" id="searchTeamInput" placeholder="Buscar equipo..." class="search-input">
            </div>
        </header>

        <!-- Cuadrícula / Lista de Equipos -->
        <main>
            <div id="teams-grid" class="teams-grid-detailed">
                <p class="text-muted">⏳ Cargando equipos y estadísticas...</p>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
