<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superliga Europea - Clasificación y Goleadores</title>
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Librería de Supabase para JavaScript (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>🏆 Superliga Europea 2026/27</h1>
        <p>Base de datos oficial en tiempo real</p>
    </header>

    <main class="container">
        <section>
            <h2>⚽ Máximos Goleadores</h2>
            <table id="goleadores-table">
                <thead>
                    <tr>
                        <th>Jugador</th>
                        <th>Nacionalidad</th>
                        <th>Goles</th>
                        <th>Asistencias</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los datos se cargarán aquí automáticamente con JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Tu script de lógica -->
    <script src="app.js"></script>
</body>
</html>
