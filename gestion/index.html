<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superliga Europea - Listado de Equipos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="page-container">
        <!-- Cabecera limpia con Buscador -->
        <header class="simple-header">
            <div class="header-title-wrap">
                <h1>🛡️ Equipos de la Superliga</h1>
                <p>Haz clic en cualquier equipo para ver su plantilla o pulsa en las cabeceras para ordenar</p>
            </div>
            <div class="search-wrap">
                <input type="text" id="searchTeamInput" placeholder="Buscar equipo..." class="search-input">
            </div>
        </header>

        <!-- Contenedor de la Tabla -->
        <main class="table-card">
            <div class="table-responsive">
                <table class="besoccer-table" id="teamsTable">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name">Equipo ↕</th>
                            <th class="sortable text-center" data-sort="division">División ↕</th>
                            <th class="sortable text-center" data-sort="playerCount">N.º Jugadores ↕</th>
                            <th class="sortable text-center" data-sort="avgAge">Edad Media ↕</th>
                        </tr>
                    </thead>
                    <tbody id="teamsTableBody">
                        <tr>
                            <td colspan="4" class="text-center text-muted">⏳ Cargando equipos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
